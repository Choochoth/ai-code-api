
app = "okcode-api-fly-app"
primary_region = "iad"

[env]
  ENV = "development"
  GCS_BUCKET_NAME = "captcha-ocr-service"
  GOOGLE_APPLICATION_CREDENTIALS = "./captcha-templates-187c30864e63.json"

[processes]
  app = "uvicorn main:app --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[restart]]
  policy = "on-failure"
  retries = 10
