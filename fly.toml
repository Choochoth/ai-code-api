
app = "ai-code-api"
primary_region = "iad"

[env]
  ENV = "development"
  PORT = "8000"
  GCS_BUCKET_NAME = "captcha-ocr-service"
  GOOGLE_APPLICATION_CREDENTIALS = "/app/captcha-templates-187c30864e63.json"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
