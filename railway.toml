# railway.toml
"$schema" = "https://railway.com/railway.schema.json"

[project]
name = "ai-code-api"

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[service]
region = "oregon"

[repository]
url = "https://github.com/Choochoth/ai-code-api"
branch = "railway-redeploy"
autoDeploy = true

[env]
# กำหนดค่าเริ่มต้นสำหรับ production
PORT = "8000"
ENV = "production"
