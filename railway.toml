"$schema" = "https://railway.com/railway.schema.json"

[project]
name = "ai-code-api"

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
runtime = "V2"
numReplicas = 1
healthcheckPath = "/"
sleepApplication = false
useLegacyStacker = false
multiRegionConfig = { "us-west2" = { numReplicas = 1 } }
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckTimeout = 300

[repository]
url = "https://github.com/Choochoth/ai-code-api"
branch = "railway-redeploy"
autoDeploy = true

[env]
# Environment variables (Railway secrets or .env)
BACKEND_API_URL = "https://ai-code-api-production-8218.up.railway.app"
CHANNEL_CODE = "-1002870022460"
CHANNEL_PAYMENT = "-1003010577707"
ENV = "production"
GCS_BUCKET_NAME = "captcha-ocr-service"
GOOGLE_APPLICATION_CREDENTIALS = "/app/captcha-templates-187c30864e63.json"
TELEGRAM_BOT_TOKEN = "8216073511:AAG8ujT2dkmO9s_jYu9AonZJhfqDt-TcAhc"

